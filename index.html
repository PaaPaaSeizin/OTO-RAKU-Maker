<script>
    // ========== プラグイン管理システム ==========
    let plugins = []; // { id, name, scriptUrl, settingsUI, instanceId, scriptElement }
    let nextPluginId = 1;

    // プラグイン登録API (プラグインから呼び出される)
    window.OTOPLUGIN = window.OTOPLUGIN || {};
    window.OTOPLUGIN.registerPlugin = function(manifest) {
        // manifest: { name, version, author, settingsUI, setup, destroy }
        // 既存のプラグインかチェック
        let existing = plugins.find(p => p.name === manifest.name);
        if (existing) {
            console.warn(`Plugin "${manifest.name}" already registered.`);
            return;
        }
        const pluginId = nextPluginId++;
        const newPlugin = {
            id: pluginId,
            name: manifest.name,
            version: manifest.version || "1.0",
            author: manifest.author || "",
            scriptUrl: "dynamic",
            settingsUI: manifest.settingsUI || null,
            setup: manifest.setup || null,
            destroy: manifest.destroy || null,
            instance: null
        };
        plugins.push(newPlugin);
        // セットアップがあれば実行
        if (newPlugin.setup) {
            try {
                newPlugin.instance = newPlugin.setup(document, window, { mainApp: window.appContext });
            } catch(e) { console.error("Plugin setup error:", e); }
        }
        renderPluginList();
        document.getElementById("statusMsg").innerText = `プラグイン「${manifest.name}」を読み込みました`;
    };

    // プラグインの登録解除
    window.OTOPLUGIN.unregisterPlugin = function(name) {
        const index = plugins.findIndex(p => p.name === name);
        if (index !== -1) {
            const p = plugins[index];
            if (p.destroy && p.instance) {
                try { p.destroy(p.instance); } catch(e) { console.error(e); }
            }
            plugins.splice(index, 1);
            renderPluginList();
            document.getElementById("statusMsg").innerText = `プラグイン「${name}」を削除しました`;
            return true;
        }
        return false;
    };

    // 外部JSを読み込んでプラグインを追加
    function loadPluginFromUrl(url) {
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = url;
            script.onload = () => {
                resolve(true);
            };
            script.onerror = () => {
                reject(new Error(`Failed to load script: ${url}`));
            };
            document.head.appendChild(script);
        });
    }

    // ファイルからプラグインを読み込み
    function loadPluginFromFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const scriptContent = e.target.result;
                const blob = new Blob([scriptContent], { type: 'application/javascript' });
                const url = URL.createObjectURL(blob);
                const script = document.createElement('script');
                script.src = url;
                script.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(true);
                };
                script.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error("Script execution error"));
                };
                document.head.appendChild(script);
            };
            reader.onerror = () => reject(new Error("File read error"));
            reader.readAsText(file);
        });
    }

    // プラグイン一覧描画
    function renderPluginList() {
        const container = document.getElementById("pluginListContainer");
        if (!container) return;
        if (plugins.length === 0) {
            container.innerHTML = '<div style="color:#aaa; text-align:center;">プラグインはありません</div>';
            return;
        }
        container.innerHTML = plugins.map(p => `
            <div class="plugin-item" data-id="${p.id}">
                <div class="plugin-name">
                    ${escapeHtml(p.name)} <span style="font-size:0.7rem; color:#aaa;">v${p.version}</span>
                    ${p.author ? `<span style="font-size:0.6rem;"> by ${escapeHtml(p.author)}</span>` : ''}
                </div>
                <div>
                    ${p.settingsUI ? `<button class="setting-btn" data-id="${p.id}">⚙️ 設定</button>` : ''}
                    <button class="delete-btn" data-id="${p.id}">🗑️ 削除</button>
                </div>
            </div>
        `).join('');
        // イベント登録
        document.querySelectorAll('.setting-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.dataset.id);
                const plugin = plugins.find(p => p.id === id);
                if (plugin && plugin.settingsUI) {
                    plugin.settingsUI();
                } else {
                    document.getElementById("statusMsg").innerText = "このプラグインに設定UIはありません";
                }
            });
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.dataset.id);
                const plugin = plugins.find(p => p.id === id);
                if (plugin && confirm(`プラグイン「${plugin.name}」を削除しますか？`)) {
                    window.OTOPLUGIN.unregisterPlugin(plugin.name);
                }
            });
        });
    }

    // モーダル制御
const pluginManagerBtn = document.getElementById("pluginManagerBtn");
const modal = document.getElementById("pluginModal");
const closeModalBtn = document.getElementById("closePluginModal");

// モーダルを開く

// ファイル選択ボタン
const pluginFileSelectBtn = document.getElementById("pluginFileSelectBtn");
const pluginFileInput = document.getElementById("pluginFileInput");
if (pluginFileSelectBtn && pluginFileInput) {
    pluginFileSelectBtn.addEventListener("click", (e) => {

    pluginFileInput.addEventListener("change", async (e) => {

        if (!file) return;
        try {
            await loadPluginFromFile(file);
            document.getElementById("statusMsg").innerText = `プラグイン読み込み: ${file.name}`;
            renderPluginList();
        } catch(err) {
            console.error(err);
            document.getElementById("statusMsg").innerText = `プラグイン読み込みエラー: ${err.message}`;

}
    // ファイル選択トリガー用ラベル対応
    document.querySelector('.file-input-label')?.addEventListener('click', () => {
        pluginFileInput.click();
    });

    // 内蔵プラグイン（書き換え版）: 使い方ガイド
window.OTOPLUGIN.registerPlugin({
    name: "使い方ガイド",
    version: "1.0",
    author: "OTO-RAKU",
    settingsUI: () => {
        alert("「使い方ガイド」について設定という概念はありますか？");
    },
    setup: (doc, win, ctx) => {

window.open(url, "_blank");
            });

});

    // ========== 以下、既存のStage6スクリプト（全体） ==========
    // ========== 音階 (2オクターブ・24音階・下が低音) ==========
    let NOTE_NAMES = [];
    for (let oct = 1; oct <= 2; oct++) {
        NOTE_NAMES.push(`ド${oct}`, `ド#${oct}`, `レ${oct}`, `レ#${oct}`, `ミ${oct}`, `ファ${oct}`, `ファ#${oct}`, `ソ${oct}`, `ソ#${oct}`, `ラ${oct}`, `ラ#${oct}`, `シ${oct}`);
    }
    NOTE_NAMES.reverse();
    let ROWS = NOTE_NAMES.length;
    let CELL_W = 36;
    let ROW_H = 40;
    let BEATS = 32;

// 64分音符単位のスナップ（分割など内部処理用）
const SNAP_DIVISION = 64;
function snapDivision(beat) {
    return Math.round(beat * SNAP_DIVISION) / SNAP_DIVISION;
}

// 磁石用スナップ（整数拍＝4分音符）
function snapMagnet(beat, enabled) {
    if (!enabled) return beat;
    return Math.round(beat);
}

    let instruments = [];
    let pieces = [];
    let bgmPiece = null;
    let selectedInstId = null;
    let nextInstId = 1;
    let nextPieceId = 1;

    let magnetEnabled = true;
    let currentBPM = 120;
    let isPlaying = false;
    let audioCtx = null;
    let scheduledSources = [];
    let animationFrame = null;
    let currentPlayheadBeat = 0;
    let selectedPieceIds = [];
    let clipboardPieces = [];
    let lastContextMenuMousePos = { beat: 0, row: 0 };
    let splitTargetPiece = null;

    let historyStack = [];
    let historyIndex = -1;
    const MAX_HISTORY = 50;

    let currentTestSource = null;

    let canvas = document.getElementById("pianoCanvas");
    let ctx = canvas.getContext("2d");
    let canvasWrapper = document.getElementById("canvasWrapper");
    let playheadDiv = document.getElementById("playhead");
    let gridContainerDiv = document.getElementById("gridContainer");

    let dragState = {
        active: false, type: null, pieceId: null,
        startMouseX: 0, startMouseY: 0,
        originalCol: 0, originalLen: 0, originalRow: 0,
        multiSelectMove: false, originalSelectedPieces: []
    };
    let contextMenuPieceId = null;
    const RESIZE_THRESHOLD = 20;

    // ========== 追加: 再生中のアクティブなソースを管理 ==========
    let activePlaybackSources = []; // { src, gainNode, instId, pieceId, bgm }

    // ========== 追加: 再生中の音量・ミュート・ソロをリアルタイム更新する関数 ==========
    function isAnySolo() {
        return instruments.some(inst => inst.solo === true);
    }

    function updateAllActiveGains() {
        const anySolo = isAnySolo();
        for (const item of activePlaybackSources) {
            let targetGain = 0;
            if (item.bgm) {
                // BGMトラック
                if (bgmPiece && !bgmPiece.mute && (!anySolo)) {
                    targetGain = (bgmPiece.volume || 80) / 100;
                } else {
                    targetGain = 0;
                }
            } else {
                const inst = instruments.find(i => i.id === item.instId);
                if (inst) {
                    if (inst.mute) {
                        targetGain = 0;
                    } else if (anySolo && !inst.solo) {
                        targetGain = 0;
                    } else {
                        targetGain = inst.volume / 100;
                    }
                }
            }
            if (item.gainNode) {
                item.gainNode.gain.value = targetGain;
            }
        }
    }

function updateAllActiveRates() {
    for (const item of activePlaybackSources) {
        if (item.bgm) continue;
        const piece = pieces.find(p => p.id === item.pieceId);
        const inst = instruments.find(i => i.id === item.instId);
        if (piece && inst && item.src) {
            const newRate = getPlaybackRate(piece, inst);
            item.src.playbackRate.value = newRate;
        }
    }
}

    // BPM入力のリアルタイム対応 (init内のイベントを拡張)

    function saveToHistory() {
        const state = {
            pieces: JSON.parse(JSON.stringify(pieces)),
            selectedPieceIds: [...selectedPieceIds],
            nextPieceId: nextPieceId
        };
        historyStack = historyStack.slice(0, historyIndex + 1);
        historyStack.push(state);
        if (historyStack.length > MAX_HISTORY) historyStack.shift();
        else historyIndex = historyStack.length - 1;
    }

    function undo() {
        if (historyIndex <= 0) return;
        historyIndex--;
        restoreState(historyStack[historyIndex]);
    }

    function redo() {
        if (historyIndex >= historyStack.length - 1) return;
        historyIndex++;
        restoreState(historyStack[historyIndex]);
    }

    function restoreState(state) {
        pieces = JSON.parse(JSON.stringify(state.pieces));
        selectedPieceIds = [...state.selectedPieceIds];
        nextPieceId = state.nextPieceId;
        updateMaxBeats();
        drawGridAndPieces();
        updateSelectionBadge();
        document.getElementById("statusMsg").innerText = `復元しました (${historyIndex+1}/${historyStack.length})`;
    }

    function withHistory(fn) {
        fn();
        saveToHistory();

    function beatsToPx(beats) { return beats * CELL_W; }
    function pxToBeats(px) { return px / CELL_W; }
    function rowsToPx(row) { return row * ROW_H; }
    function pxToRow(px) { return Math.floor(px / ROW_H); }

    function updateMaxBeats() {
        let maxCol = 0;
        for (let p of pieces) {
            let right = p.col + p.length;
            if (right > maxCol) maxCol = right;
        }
        if (bgmPiece && bgmPiece.buffer) {
            let bgmLenBeats = (bgmPiece.buffer.duration * currentBPM) / 60;
            if (bgmLenBeats > maxCol) maxCol = bgmLenBeats;
        }
        maxCol = Math.ceil(maxCol) + 2;
        if (maxCol > BEATS) {
            BEATS = maxCol;
            resizeCanvas();
        }
    }

    function resizeCanvas() {
        canvas.width = beatsToPx(BEATS);
        canvas.height = rowsToPx(ROWS);
        canvasWrapper.style.width = canvas.width + 'px';
        canvasWrapper.style.height = canvas.height + 'px';
        drawGridAndPieces();
        updatePlayheadPosition();

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function centsToRate(cents) { return Math.pow(2, cents / 1200); }
    function getSemitoneFromRow(row) { return (ROWS - 1 - row); }
    function getPlaybackRate(piece, inst) {
        let semitone = getSemitoneFromRow(piece.row);
        let rate = centsToRate(inst.pitchCents) * Math.pow(2, semitone / 12);
        if (piece.stretchMode) {
            const pieceDurationSec = (piece.length * 60) / currentBPM;
            const sourceDuration = (piece.endOffset ?? inst.sampleDuration) - (piece.startOffset ?? 0);
            if (sourceDuration > 0 && pieceDurationSec > 0) rate *= (sourceDuration / pieceDurationSec);
        }
        return rate;
    }
    function getPieceTotalDuration(piece, inst) {
        const pieceLengthSec = (piece.length * 60) / currentBPM;
        const sourceDuration = (piece.endOffset ?? inst.sampleDuration) - (piece.startOffset ?? 0);
        const rate = getPlaybackRate(piece, inst);
        let naturalDuration;
        if (piece.stretchMode) naturalDuration = pieceLengthSec;
        else naturalDuration = sourceDuration / rate;
        return Math.min(naturalDuration, pieceLengthSec);
    }
    function getPieceStartInfo(piece, inst, globalStartBeat) {
        const pieceStartBeat = piece.col;
        const pieceEndBeat = piece.col + piece.length;
        if (pieceEndBeat <= globalStartBeat) return null;
        let actualStartBeat = pieceStartBeat;
        let offsetWithinPiece = 0;
        if (globalStartBeat > pieceStartBeat) {
            const ratio = (globalStartBeat - pieceStartBeat) / piece.length;
            const totalDur = getPieceTotalDuration(piece, inst);
            offsetWithinPiece = totalDur * ratio;
            actualStartBeat = globalStartBeat;
        }
        const startTimeSec = (actualStartBeat - globalStartBeat) * 60 / currentBPM;
        const finalOffset = (piece.startOffset ?? 0) + offsetWithinPiece;
        return { startTimeSec, offsetWithinPiece: finalOffset };
    }

    function addPiece(instId, row, col, length = 1.0, stretchMode = false, startOffset = 0, endOffset = null) {
        const newPiece = { id: nextPieceId++, instId, row, col, length, stretchMode, startOffset, endOffset };
        pieces.push(newPiece);
        updateMaxBeats();
        drawGridAndPieces();
        return newPiece;
    }
    function deletePieces(pieceIds) {
        pieces = pieces.filter(p => !pieceIds.includes(p.id));
        selectedPieceIds = selectedPieceIds.filter(id => !pieceIds.includes(id));
        updateMaxBeats();
        drawGridAndPieces();

    }
    function copyPieces(pieceIds) {
        clipboardPieces = pieces.filter(p => pieceIds.includes(p.id)).map(p => ({ ...p, id: null }));
        document.getElementById("statusMsg").innerText = `${clipboardPieces.length}個のピースをコピーしました`;
    }
    function pastePieces(baseBeat, baseRow) {
        if (!clipboardPieces.length) return;
        let minCol = Math.min(...clipboardPieces.map(p => p.col));
        let minRow = Math.min(...clipboardPieces.map(p => p.row));
        let newPieceIds = [];
        for (let cp of clipboardPieces) {
            let newCol = baseBeat + (cp.col - minCol);
            let newRow = baseRow + (cp.row - minRow);
            if (newRow < 0) newRow = 0;
            if (newRow >= ROWS) newRow = ROWS-1;
            if (newCol < 0) newCol = 0;
            let newP = addPiece(cp.instId, newRow, newCol, cp.length, cp.stretchMode, cp.startOffset ?? 0, cp.endOffset ?? null);
            newPieceIds.push(newP.id);
        }
        selectedPieceIds = newPieceIds;
        drawGridAndPieces();
        updateSelectionBadge();
        document.getElementById("statusMsg").innerText = `${newPieceIds.length}個のピースを貼り付け (選択済み)`;
        saveToHistory();
    }
    function toggleStretchMode(pieceIds) {
        withHistory(() => {
            for (let id of pieceIds) {
                const p = pieces.find(p => p.id === id);
                if (p) p.stretchMode = !p.stretchMode;
            }
        });
        drawGridAndPieces();
    }
    function splitPiece(pieceId, splitBeat) {
    const piece = pieces.find(p => p.id === pieceId);
    if (!piece) return;
    // ★ 磁石のON/OFFに関係なく、64分音符単位でスナップ
    splitBeat = snapDivision(splitBeat);
    if (splitBeat <= piece.col || splitBeat >= piece.col + piece.length) return;
        const inst = instruments.find(i => i.id === piece.instId);
        if (!inst) return;
        const totalDur = getPieceTotalDuration(piece, inst);
        const ratio = (splitBeat - piece.col) / piece.length;
        const splitOffset = (piece.startOffset ?? 0) + totalDur * ratio;
        const sourceEnd = piece.endOffset ?? inst.sampleDuration;
        const leftPiece = {
            ...piece,
            id: nextPieceId++,
            length: splitBeat - piece.col,
            startOffset: piece.startOffset ?? 0,
            endOffset: splitOffset
        };
        const rightPiece = {
            ...piece,
            id: nextPieceId++,
            col: splitBeat,
            length: piece.length - (splitBeat - piece.col),
            startOffset: splitOffset,
            endOffset: sourceEnd
        };
        withHistory(() => {
            pieces = pieces.filter(p => p.id !== piece.id);
            pieces.push(leftPiece, rightPiece);
            selectedPieceIds = [leftPiece.id, rightPiece.id];
            updateMaxBeats();
        });
        drawGridAndPieces();
        updateSelectionBadge();
        document.getElementById("statusMsg").innerText = "ピースを分割しました (64分単位でスナップ)";
    }
    function updateSelectionBadge() {
        const badge = document.getElementById("selectionCountBadge");
        if (selectedPieceIds.length > 1) {
            badge.style.display = "inline-block";
            badge.innerText = `${selectedPieceIds.length}個選択`;
        } else {
            badge.style.display = "none";
        }
    }
    function moveSelectedPieces(deltaCol, deltaRow) {
    if (selectedPieceIds.length === 0) return;
    withHistory(() => {
        for (let id of selectedPieceIds) {
            const p = pieces.find(p => p.id === id);
            if (p) {
                let newCol = snapMagnet(p.col + deltaCol, magnetEnabled);
                let newRow = p.row + deltaRow;
                if (newCol < 0) newCol = 0;
                if (newRow < 0) newRow = 0;
                if (newRow >= ROWS) newRow = ROWS-1;
                p.col = newCol;
                p.row = newRow;
            }
        }
        updateMaxBeats();
    });
    drawGridAndPieces();
}
    function selectAllPieces() {
        if (selectedInstId !== null) {
            selectedPieceIds = pieces.filter(p => p.instId === selectedInstId).map(p => p.id);

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toFixed(2).padStart(5, '0')}`;
    }
    function updateTimeDisplay() {
        const totalSeconds = (BEATS * 60) / currentBPM;
        const currentSeconds = (currentPlayheadBeat * 60) / currentBPM;
        const timeDisplay = document.getElementById("timeDisplay");
        if (timeDisplay) {
            timeDisplay.innerText = `${formatTime(currentSeconds)} / ${formatTime(totalSeconds)}`;
        }

    // drawGridAndPieces に時間目盛りを追加 (元の関数を上書き)
    const originalDrawGridAndPieces = drawGridAndPieces;
    drawGridAndPieces = function() {
        originalDrawGridAndPieces();
        // 追加: グリッドの下に時間表示
        if (!ctx) return;
        ctx.save();
        ctx.font = "10px monospace";
        ctx.fillStyle = "#aaaaaa";
        const yPos = canvas.height + 12;
        for (let c = 0; c <= BEATS; c++) {
            const x = beatsToPx(c);
            const beatTime = (c * 60) / currentBPM;
            const timeStr = beatTime.toFixed(1) + "s";
            ctx.fillText(timeStr, x + 2, yPos);
        }
        ctx.restore();
    };

    // 元の drawGridAndPieces を置き換えるため、変数を再定義
    // ただし、既に drawGridAndPieces は関数として宣言されているので、上書きは問題ない。

    function drawGridAndPieces() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#4a4a6a";
        ctx.lineWidth = 0.5;
        for (let r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r*ROW_H); ctx.lineTo(canvas.width, r*ROW_H); ctx.stroke(); }
        for (let c = 0; c <= BEATS; c++) { let x = beatsToPx(c); ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
        ctx.font = "12px monospace"; ctx.fillStyle = "#ffb347";
        for (let r = 0; r < ROWS; r++) ctx.fillText(NOTE_NAMES[r], 4, r*ROW_H+ROW_H-12);
        if (selectedInstId !== null) {
            const instPieces = pieces.filter(p => p.instId === selectedInstId);
            for (let piece of instPieces) {
                let x = beatsToPx(piece.col), y = rowsToPx(piece.row), w = beatsToPx(piece.length), h = ROW_H-2;
                if (w < 1) w = 1;
                const isSelected = selectedPieceIds.includes(piece.id);
                ctx.fillStyle = isSelected ? "#5a9effcc" : "#f0a35ecc";
                ctx.fillRect(x+1, y+1, w-1, h);
                ctx.strokeStyle = "white";
                ctx.strokeRect(x+1, y+1, w-1, h);
                ctx.fillStyle = piece.stretchMode ? "#88aaff" : "#aaffaa";
                ctx.font = "10px monospace";
                ctx.fillText(piece.stretchMode ? "⚡" : "◯", x+4, y+ROW_H-10);
                if ((piece.startOffset && piece.startOffset > 0.01) || (piece.endOffset !== undefined && piece.endOffset < (instruments.find(i=>i.id===piece.instId)?.sampleDuration || 0))) {
                    ctx.fillStyle = "#ffaa88";
                    ctx.fillText("✂", x+12, y+ROW_H-10);
                }
                if (isSelected) {
                    ctx.save(); ctx.strokeStyle = "#33aaff"; ctx.lineWidth = 2;
                    ctx.strokeRect(x+1, y+1, w-1, h); ctx.restore();
                }
            }
        }
        if (dragState.pieceId) {
            const piece = pieces.find(p => p.id === dragState.pieceId);
            if (piece && piece.instId === selectedInstId) {
                let x = beatsToPx(piece.col), y = rowsToPx(piece.row), w = beatsToPx(piece.length);
                ctx.save(); ctx.strokeStyle = "yellow"; ctx.lineWidth = 2;
                ctx.strokeRect(x+1, y+1, w-1, ROW_H-2); ctx.restore();
            }
        }
        // 追加: グリッドの下に時間表示
        ctx.save();
        ctx.font = "10px monospace";
        ctx.fillStyle = "#aaaaaa";
        const yPos = canvas.height + 12;
        for (let c = 0; c <= BEATS; c++) {
            const x = beatsToPx(c);
            const beatTime = (c * 60) / currentBPM;
            const timeStr = beatTime.toFixed(1) + "s";
            ctx.fillText(timeStr, x + 2, yPos);
        }
        ctx.restore();
    }
    // ※ 元の drawGridAndPieces を完全に置き換えたので、以降のコードで参照される新しい関数になる。

    function findPieceAt(mouseX, mouseY) {
        if (selectedInstId === null) return null;
        const beat = pxToBeats(mouseX);
        const row = pxToRow(mouseY);
        if (row < 0 || row >= ROWS) return null;
        const instPieces = pieces.filter(p => p.instId === selectedInstId);
        for (let i = instPieces.length-1; i >= 0; i--) {
            const p = instPieces[i];
            if (p.row === row && beat >= p.col && beat < p.col + p.length) return p;
        }
        return null;
    }

    function updateMouseCursor(e) {
        if (dragState.active) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let mouseX = (e.clientX - rect.left) * scaleX;
        let mouseY = (e.clientY - rect.top) * scaleY;
        const piece = findPieceAt(mouseX, mouseY);
        if (!piece) {
            canvas.style.cursor = "crosshair";
            return;
        }
        const pieceLeft = beatsToPx(piece.col);
        const pieceRight = beatsToPx(piece.col + piece.length);
        if (Math.abs(mouseX - pieceLeft) < RESIZE_THRESHOLD || Math.abs(mouseX - pieceRight) < RESIZE_THRESHOLD) {
            canvas.style.cursor = "ew-resize";
        } else {
            canvas.style.cursor = "grab";
        }
    }

    function onCanvasMouseDown(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let mouseX = (e.clientX - rect.left) * scaleX;
        let mouseY = (e.clientY - rect.top) * scaleY;
        const piece = findPieceAt(mouseX, mouseY);
        if (e.button === 2) {
            e.preventDefault();
            if (piece) {
                if (!selectedPieceIds.includes(piece.id)) { selectedPieceIds = [piece.id]; drawGridAndPieces(); updateSelectionBadge(); }
                // ★ 修正: snapBeat → snapMagnet (貼り付け位置用), snapDivision (分割用)
                lastContextMenuMousePos = { beat: snapMagnet(pxToBeats(mouseX), magnetEnabled), row: pxToRow(mouseY) };
                splitTargetPiece = { pieceId: piece.id, splitBeat: snapDivision(pxToBeats(mouseX)) };
                showContextMenu(e.clientX, e.clientY);
            } else {
                lastContextMenuMousePos = { beat: snapMagnet(pxToBeats(mouseX), magnetEnabled), row: pxToRow(mouseY) };
                showEmptyContextMenu(e.clientX, e.clientY);
            }
            return;
        }
        if (!piece) {
            if (!selectedInstId) return;
            if (selectedPieceIds.length > 1) {
                document.getElementById("statusMsg").innerText = "複数選択中は新規ピースを作成できません (Escで解除)";
                return;
            }
            let beat = snapMagnet(pxToBeats(mouseX), magnetEnabled);
            let row = pxToRow(mouseY);
            if (row>=0 && row<ROWS && beat>=0) {
                withHistory(() => {
                    addPiece(selectedInstId, row, beat, 1.0, false, 0, null);
                });
            }
            return;
        }
        if (e.ctrlKey) {
            if (selectedPieceIds.includes(piece.id)) selectedPieceIds = selectedPieceIds.filter(id => id !== piece.id);
            else selectedPieceIds.push(piece.id);
            drawGridAndPieces(); updateSelectionBadge();
            return;
        } else {
            if (!selectedPieceIds.includes(piece.id)) { selectedPieceIds = [piece.id]; drawGridAndPieces(); updateSelectionBadge(); }
        }
        const pieceLeft = beatsToPx(piece.col);
        const pieceRight = beatsToPx(piece.col + piece.length);
        let dragType = null;
        if (Math.abs(mouseX - pieceLeft) < RESIZE_THRESHOLD) dragType = "resize-left";
        else if (Math.abs(mouseX - pieceRight) < RESIZE_THRESHOLD) dragType = "resize-right";
        else dragType = "move";
        dragState = {
            active: true, type: dragType, pieceId: piece.id,
            startMouseX: mouseX, startMouseY: mouseY,
            originalCol: piece.col, originalLen: piece.length, originalRow: piece.row,
            multiSelectMove: false, originalSelectedPieces: []
        };
        if (dragType === "move" && selectedPieceIds.length > 1) {
            dragState.multiSelectMove = true;
            dragState.originalSelectedPieces = selectedPieceIds.map(id => {
                const p = pieces.find(p => p.id === id);
                return p ? { id, col: p.col, row: p.row } : null;
            }).filter(v => v);
        }
        drawGridAndPieces();
    }

    function onCanvasMouseMove(e) {
    updateMouseCursor(e);
    if (!dragState.active) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    let mouseX = (e.clientX - rect.left) * scaleX;
    let mouseY = (e.clientY - rect.top) * scaleY;
    const piece = pieces.find(p => p.id === dragState.pieceId);
    if (!piece) { dragState.active = false; return; }
    const inst = instruments.find(i => i.id === piece.instId);
    if (!inst) { dragState.active = false; return; }
    let deltaBeats = pxToBeats(mouseX - dragState.startMouseX);
    if (magnetEnabled) deltaBeats = Math.round(deltaBeats);

    if (dragState.type === "move") {
        if (dragState.multiSelectMove && dragState.originalSelectedPieces.length) {
            for (let orig of dragState.originalSelectedPieces) {
                const p = pieces.find(p => p.id === orig.id);
                if (p) {
                    let newCol = snapMagnet(orig.col + deltaBeats, magnetEnabled);
                    if (newCol < 0) newCol = 0;
                    p.col = newCol;
                    let deltaRow = Math.round((mouseY - dragState.startMouseY) / ROW_H);
                    let newRow = orig.row + deltaRow;
                    newRow = Math.min(Math.max(0, newRow), ROWS-1);
                    p.row = newRow;
                }
            }
        } else {
            let newCol = dragState.originalCol + deltaBeats;
            if (magnetEnabled) newCol = Math.round(newCol);
            if (newCol < 0) newCol = 0;
            piece.col = newCol;
            let deltaRow = Math.round((mouseY - dragState.startMouseY) / ROW_H);
            let newRow = dragState.originalRow + deltaRow;
            newRow = Math.min(Math.max(0, newRow), ROWS-1);
            piece.row = newRow;
        }
    } else if (dragState.type === "resize-right") {
        let newLen = dragState.originalLen + deltaBeats;
        if (magnetEnabled) newLen = Math.round(newLen);
        if (newLen < 0.1) newLen = 0.1;
        const oldLenSec = (dragState.originalLen * 60) / currentBPM;
        const newLenSec = (newLen * 60) / currentBPM;
        const oldEndOffset = piece.endOffset ?? inst.sampleDuration;
        const newEndOffset = Math.min(inst.sampleDuration, (piece.startOffset ?? 0) + (oldEndOffset - (piece.startOffset ?? 0)) * (newLenSec / oldLenSec));
        piece.endOffset = newEndOffset;
        piece.length = newLen;
    } else if (dragState.type === "resize-left") {
        let newStart = dragState.originalCol + deltaBeats;
        if (magnetEnabled) newStart = Math.round(newStart);
        if (newStart < 0) newStart = 0;
        let newEnd = dragState.originalCol + dragState.originalLen;
        if (newStart >= newEnd) newStart = newEnd - 0.1;
        const oldStartOffset = piece.startOffset ?? 0;
        const sourceDuration = (piece.endOffset ?? inst.sampleDuration) - oldStartOffset;
        const ratio = (dragState.originalCol - newStart) / dragState.originalLen;
        const deltaOffsetSec = sourceDuration * ratio;
        let newStartOffset = oldStartOffset + deltaOffsetSec;
        newStartOffset = Math.max(0, Math.min(newStartOffset, piece.endOffset ?? inst.sampleDuration - 0.01));
        piece.startOffset = newStartOffset;
        piece.col = newStart;
        piece.length = newEnd - newStart;
    }
    updateMaxBeats();
    drawGridAndPieces();
}

    function onCanvasMouseUp() {
        if (dragState.active) saveToHistory();
        dragState.active = false;
        drawGridAndPieces();

    function updatePlayheadPosition() {
        if (!playheadDiv) return;
        let x = beatsToPx(currentPlayheadBeat);
        playheadDiv.style.left = x + 'px';
        playheadDiv.style.height = canvas.height + 'px';
        const container = gridContainerDiv;
        const scrollLeft = container.scrollLeft;
        const viewRight = scrollLeft + container.clientWidth;
        if (x < scrollLeft + 30) container.scrollLeft = Math.max(0, x - 30);
        else if (x > viewRight - 30) container.scrollLeft = x + 30 - container.clientWidth;
        // 追加: 時間表示更新
        updateTimeDisplay();
    }
    function initPlayheadDrag() {
        let drag = false;
        playheadDiv.style.pointerEvents = "auto";
        playheadDiv.addEventListener("mousedown", (e) => {
            if (isPlaying) stopPlayback();
            drag = true;
            e.preventDefault();
        });
        window.addEventListener("mousemove", (e) => {
            if (!drag) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            let mouseX = (e.clientX - rect.left) * scaleX;
            let beat = pxToBeats(mouseX);
            if (beat < 0) beat = 0;
            if (beat > BEATS) beat = BEATS;
            currentPlayheadBeat = beat;
            updatePlayheadPosition();
        });
        window.addEventListener("mouseup", () => { drag = false; });
    }
    function stopPlayback() {
        if (isPlaying) {
            for (let src of scheduledSources) try { src.stop(); } catch(e) {}
            scheduledSources = [];
            // 追加: アクティブなソースリストをクリア
            activePlaybackSources = [];
            isPlaying = false;
            if (animationFrame) cancelAnimationFrame(animationFrame);
            document.getElementById("statusMsg").innerText = "停止";
            updateTimeDisplay(); // 停止時も更新
        }
    }
    async function playPattern() {
        if (isPlaying) { stopPlayback(); return; }
        if (!audioCtx) initAudio();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        isPlaying = true;
        scheduledSources = [];
        activePlaybackSources = []; // 再開時にクリア
        const startTime = audioCtx.currentTime;
        const startBeat = currentPlayheadBeat;
        for (let piece of pieces) {
            const inst = instruments.find(i => i.id === piece.instId);
            if (!inst || !inst.buffer) continue;
            if (inst.mute) continue;
            if (instruments.some(i => i.solo) && !inst.solo) continue;
            const info = getPieceStartInfo(piece, inst, startBeat);
            if (!info) continue;
            const src = audioCtx.createBufferSource();
            src.buffer = inst.buffer;
            src.playbackRate.value = getPlaybackRate(piece, inst);
            const gain = audioCtx.createGain();
            // 初期ゲインはinst.volume / 100 とするが、後で updateAllActiveGains で再計算する
            gain.gain.value = inst.volume / 100;
            src.connect(gain);
            gain.connect(audioCtx.destination);
            src.start(startTime + info.startTimeSec, info.offsetWithinPiece);
            const totalDur = getPieceTotalDuration(piece, inst);
            const elapsedInPiece = info.offsetWithinPiece - (piece.startOffset ?? 0);
            const remaining = totalDur - elapsedInPiece;
            if (remaining > 0) src.stop(startTime + info.startTimeSec + remaining);
            scheduledSources.push(src);
            // 追加: アクティブリストに記録
            activePlaybackSources.push({ src, gainNode: gain, instId: piece.instId, pieceId: piece.id, bgm: false });
        }
        if (bgmPiece && bgmPiece.buffer && !bgmPiece.mute) {
            const bgmStartSec = - (startBeat * 60 / currentBPM);
            const src = audioCtx.createBufferSource();
            src.buffer = bgmPiece.buffer;
            const gain = audioCtx.createGain();
            gain.gain.value = (bgmPiece.volume || 80) / 100;
            src.connect(gain);
            gain.connect(audioCtx.destination);
            if (bgmStartSec < 0) src.start(startTime, -bgmStartSec);
            else src.start(startTime + bgmStartSec);
            scheduledSources.push(src);
            activePlaybackSources.push({ src, gainNode: gain, instId: null, pieceId: null, bgm: true });
        }
        // 追加: 現在のミュート/ソロ状態を適用
        updateAllActiveGains();
        function animatePlayhead() {
            if (!isPlaying || !audioCtx) return;
            const elapsed = audioCtx.currentTime - startTime;
            currentPlayheadBeat = startBeat + elapsed * currentBPM / 60;
            if (currentPlayheadBeat > BEATS) currentPlayheadBeat = BEATS;
            updatePlayheadPosition();
            if (isPlaying) animationFrame = requestAnimationFrame(animatePlayhead);
        }
        animatePlayhead();
        document.getElementById("statusMsg").innerText = "再生中...";
    }

    async function exportWavInternal(includeBgm) {
        if (instruments.length === 0 && (!includeBgm || !bgmPiece?.buffer)) { alert("音素材がありません"); return; }
        initAudio();
        const sampleRate = 44100;
        let maxDur = 0;
        for (let p of pieces) {
            let end = (p.col + p.length) * 60 / currentBPM;
            if (end > maxDur) maxDur = end;
        }
        if (includeBgm && bgmPiece?.buffer) {
            let bgmDur = bgmPiece.buffer.duration;
            if (bgmDur > maxDur) maxDur = bgmDur;
        }
        maxDur = Math.ceil(maxDur) + 2;
        const offlineCtx = new OfflineAudioContext({ numberOfChannels: 2, length: sampleRate * maxDur, sampleRate });
        const master = offlineCtx.createGain();
        master.connect(offlineCtx.destination);
        for (let piece of pieces) {
            const inst = instruments.find(i => i.id === piece.instId);
            if (!inst || !inst.buffer) continue;
            if (inst.mute) continue;
            if (instruments.some(i => i.solo) && !inst.solo) continue;
            const startSec = (piece.col * 60) / currentBPM;
            const src = offlineCtx.createBufferSource();
            src.buffer = inst.buffer;
            src.playbackRate.value = getPlaybackRate(piece, inst);
            const gain = offlineCtx.createGain();
            gain.gain.value = inst.volume / 100;
            src.connect(gain);
            gain.connect(master);
            const offset = piece.startOffset ?? 0;
            src.start(startSec, offset);
            const duration = getPieceTotalDuration(piece, inst);
            src.stop(startSec + duration);
        }
        if (includeBgm && bgmPiece?.buffer && !bgmPiece.mute) {
            const src = offlineCtx.createBufferSource();
            src.buffer = bgmPiece.buffer;
            const gain = offlineCtx.createGain();
            gain.gain.value = (bgmPiece.volume || 80) / 100;
            src.connect(gain);
            gain.connect(master);
            src.start(0);
        }
        const rendered = await offlineCtx.startRendering();
        const wav = bufferToWav(rendered);
        const blob = new Blob([wav], { type: "audio/wav" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${document.getElementById("projectName").value}${includeBgm ? "" : "_noBgm"}.wav`;
        a.click();
        URL.revokeObjectURL(url);
        document.getElementById("statusMsg").innerText = "WAV書き出し完了";
    }

    function bufferToWav(buffer) {
        const numChannels = buffer.numberOfChannels;
        const sampleRate = buffer.sampleRate;
        const frameLength = buffer.length;
        const dataLength = frameLength * numChannels * 2;
        const buf = new ArrayBuffer(44 + dataLength);
        const view = new DataView(buf);
        function writeString(offset, str) {
            for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        }
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + dataLength, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * numChannels * 2, true);
        view.setUint16(32, numChannels * 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, dataLength, true);
        let offset = 44;
        for (let i = 0; i < frameLength; i++) {
            for (let ch = 0; ch < numChannels; ch++) {
                let sample = buffer.getChannelData(ch)[i];
                sample = Math.max(-1, Math.min(1, sample));
                const intSample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                view.setInt16(offset, intSample, true);
                offset += 2;
            }
        }
        return buf;
    }

    function saveProject() {
        const data = {
            version:6, bpm:currentBPM, beats:BEATS,
            instruments: instruments.map(i=>({id:i.id,name:i.name,pitchCents:i.pitchCents,volume:i.volume,mute:i.mute,solo:i.solo,sampleDuration:i.sampleDuration})),
            pieces, bgmPiece: bgmPiece ? { name:bgmPiece.name, volume:bgmPiece.volume, mute:bgmPiece.mute, sampleDuration:bgmPiece.sampleDuration } : null,
            nextIds:{nextInstId,nextPieceId}, selectedInstId, noteNames: NOTE_NAMES, rows:ROWS
        };
        const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${document.getElementById("projectName").value}.otomap`;
        a.click();
        URL.revokeObjectURL(a.href);
        document.getElementById("statusMsg").innerText = "プロジェクトを保存しました";
        saveToHistory();
    }
    function loadProject(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = JSON.parse(e.target.result);
            currentBPM = data.bpm; BEATS = data.beats || 32;
            if (data.noteNames && data.rows) {
                NOTE_NAMES = data.noteNames;
                ROWS = data.rows;
            } else {
                NOTE_NAMES = ["シ²","ラ#²","ラ²","ソ#²","ソ²","ファ#²","ファ²","ミ²","レ#²","レ²","ド#²","ド²","シ¹","ラ#¹","ラ¹","ソ#¹","ソ¹","ファ#¹","ファ¹","ミ¹","レ#¹","レ¹","ド#¹","ド¹"];
                ROWS = 24;
            }
            document.getElementById("bpmInput").value = currentBPM;
            instruments = data.instruments.map(i=>({...i, buffer:null}));
            pieces = data.pieces;
            if (data.bgmPiece) bgmPiece = { id:'bgm', ...data.bgmPiece, buffer:null };
            nextInstId = data.nextIds.nextInstId;
            nextPieceId = data.nextIds.nextPieceId;
            selectedInstId = data.selectedInstId;
            resizeCanvas();
            renderInstrumentPanel();
            drawGridAndPieces();
            document.getElementById("statusMsg").innerText = "読み込み完了 (音素材は再読み込み必要)";
            saveToHistory();
        };
        reader.readAsText(file);
    }

    function onKeyDown(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        const ctrl = e.ctrlKey;
        const key = e.key;
        if (ctrl && key === 's') { e.preventDefault(); saveProject(); return; }
        if (ctrl && key === 'z') { e.preventDefault(); undo(); return; }
        if (ctrl && key === 'y') { e.preventDefault(); redo(); return; }
        if (ctrl && key === 'a') { e.preventDefault(); selectAllPieces(); return; }
        if (key === 'Delete') { e.preventDefault(); if(selectedPieceIds.length) withHistory(() => deletePieces(selectedPieceIds)); return; }
        if (key === ' ' || key === 'Space') { e.preventDefault(); playPattern(); return; }
        if (key === 'Home') { e.preventDefault(); currentPlayheadBeat = 0; updatePlayheadPosition(); return; }
        if (key === 'End') { e.preventDefault(); currentPlayheadBeat = BEATS; updatePlayheadPosition(); return; }
        // 追加: 左右キーで再生バー移動
        if (key === 'ArrowLeft') {
            e.preventDefault();
            let step = 1; // 1拍移動
            if (ctrl) step = 0.25; // Ctrl+左右で細かい移動（オプション）
            currentPlayheadBeat = Math.max(0, currentPlayheadBeat - step);
            updatePlayheadPosition();
        } else if (key === 'ArrowRight') {
            e.preventDefault();
            let step = 1;
            if (ctrl) step = 0.25;
            currentPlayheadBeat = Math.min(BEATS, currentPlayheadBeat + step);
            updatePlayheadPosition();
        }
        const moveDelta = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -1, ArrowDown: 1 };
        if (moveDelta[key]) {
            e.preventDefault();
            let deltaCol = 0, deltaRow = 0;
            if (key === 'ArrowLeft') deltaCol = -1;
            if (key === 'ArrowRight') deltaCol = 1;
            if (key === 'ArrowUp') deltaRow = -1;
            if (key === 'ArrowDown') deltaRow = 1;
            moveSelectedPieces(deltaCol, deltaRow);
        }
        if (key === 'Escape') {
            selectedPieceIds = [];
            drawGridAndPieces();
            updateSelectionBadge();
            document.getElementById("statusMsg").innerText = "選択を解除しました";
        }
    }

    function init() {
        resizeCanvas();
        canvas.addEventListener("mousedown", onCanvasMouseDown);
        canvas.addEventListener("mousemove", onCanvasMouseMove);
        canvas.addEventListener("mouseup", onCanvasMouseUp);
        canvas.addEventListener("contextmenu", (e) => e.preventDefault());
        document.getElementById("bpmInput").addEventListener("input", (e) => { 
            currentBPM = parseInt(e.target.value) || 120; 
            updateTimeDisplay(); 
            drawGridAndPieces(); 
            // 追加: 再生中ならBPM変更をリアルタイム反映（停止→再開）
            applyBPMChange();
        }); 

        const magnetBtn = document.getElementById("magnetToggle");
        if (magnetBtn) {
            const updateMagnetUI = () => {
                magnetBtn.classList.toggle("active", magnetEnabled);
                magnetBtn.innerText = magnetEnabled ? "🧲 磁石配置 ON" : "🧲 磁石配置 OFF";
            };
            updateMagnetUI();
            magnetBtn.addEventListener("click", () => {
                magnetEnabled = !magnetEnabled;
                updateMagnetUI();
            });
        }

        document.getElementById("playStopBtn").addEventListener("click", playPattern);
        document.getElementById("exportWavBtn").addEventListener("click", () => exportWavInternal(true));
        document.getElementById("exportWavNoBgmBtn").addEventListener("click", () => exportWavInternal(false));
        document.getElementById("saveProjectBtn").addEventListener("click", saveProject);
        document.getElementById("loadProjectBtn").addEventListener("click", () => document.getElementById("loadProjectFile").click());
        document.getElementById("loadProjectFile").addEventListener("change", (e) => { if(e.target.files[0]) loadProject(e.target.files[0]); });
        document.getElementById("addInstrumentBtn").addEventListener("click", () => { addInstrument("新しい楽器"); });
        addInstrument("素材#1");
        addInstrument("素材#2");
        selectedInstId = instruments[0]?.id;
        renderInstrumentPanel();
        initPlayheadDrag();
        window.addEventListener("keydown", onKeyDown);
        saveToHistory();
        updateTimeDisplay(); // 初期表示更新
    }
    function escapeHtml(str) { return str.replace(/[&<>]/g, m=>({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    init();

    // アプリコンテキストをグローバルに公開（プラグインからアクセス可能）
    window.appContext = {
        instruments, pieces, bgmPiece, selectedInstId,
        currentBPM, magnetEnabled, selectedPieceIds,
        addInstrument, deleteInstrument, addPiece, deletePieces,
        copyPieces, pastePieces, splitPiece, playPattern, stopPlayback,
        exportWavInternal, saveProject, loadProject, undo, redo,
        selectAllPieces, moveSelectedPieces
    };
</script>
</body>
</html>
